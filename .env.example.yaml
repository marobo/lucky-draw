# Server settings
PORT=3000
HOST=localhost

# WiFi settings
WIFI_SSID=YourNetworkName
WIFI_PASSWORD=YourWiFiPassword
# WPA, WEP, or leave empty for none
WIFI_ENCRYPTION=WPA

# Concept categories
# Comma-separated category keys. Order controls display order on the monitor.
# For each key, define CONCEPT_<key>_COLOR and CONCEPT_<key>_LIST.
# Colors MUST be quoted ("#RRGGBB") because an unquoted # starts a comment.
# The total number of concepts is derived automatically from the lists.
CONCEPT_TYPES=rai_ulun,rai_klaran,rai_ikun,rai_ketan

CONCEPT_rai_ulun_COLOR="#00AB55"
CONCEPT_rai_ulun_LIST=Kulu-Tunu,Makasae,Ulun-Toos,Mistisa,Mistisu

CONCEPT_rai_klaran_COLOR="#FFB400"
CONCEPT_rai_klaran_LIST=Kode-kaba-kode,Modo-Metan,Repoliu,Malirin,Ramelau

CONCEPT_rai_ikun_COLOR="#2065D1"
CONCEPT_rai_ikun_LIST=Bunak,Bee-Manas,Malae,Kemak,Kode-Lulik

CONCEPT_rai_ketan_COLOR="#FF0000"
CONCEPT_rai_ketan_LIST=Oecusse,Atauro,Jaco,Alor,Liran
